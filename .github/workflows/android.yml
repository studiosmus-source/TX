name: Android TX and RX
on:
  push:
    branches: [main, fix/rx-026-verified-originals-20261103]
  pull_request:

jobs:
  test-and-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Relay tests
        run: cd relay && node --test test/*.test.mjs
      - name: Test and build Android TX + RX
        run: gradle --no-daemon :app:testDebugUnitTest :rx:testDebugUnitTest :app:assembleDebug :rx:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RX-debug-apk
          path: rx/build/outputs/apk/debug/rx-debug.apk
          if-no-files-found: error
