name: OPPO TX v1 and v2 signature diagnostic
on:
  push:
    branches: [diagnostic/oppo-install-20261105]
  workflow_dispatch:

jobs:
  signed-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build original TX without modifying source
        run: gradle --no-daemon :app:assembleDebug
      - name: Sign with both v1 and v2
        run: |
          keytool -genkeypair -noprompt -keystore /tmp/oppo-tx.jks -storepass diagnosticOnly2026 -keypass diagnosticOnly2026 -alias diagnostic -keyalg RSA -keysize 2048 -validity 30 -dname "CN=OPPO TX diagnostic,O=Local Test,C=IT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/oppo-tx.jks --ks-key-alias diagnostic --ks-pass pass:diagnosticOnly2026 --key-pass pass:diagnosticOnly2026 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --out /tmp/gallery-tx-v1-v2.apk app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/gallery-tx-v1-v2.apk | tee /tmp/signature-report.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/signature-report.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature-report.txt
          unzip -t /tmp/gallery-tx-v1-v2.apk | tail -n 2
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/gallery-tx-v1-v2.apk | head -n 5
      - uses: actions/upload-artifact@v4
        with:
          name: Gallery-TX-OPPO-v1-v2
          path: /tmp/gallery-tx-v1-v2.apk
          if-no-files-found: error
